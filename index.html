<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Simon Says Game</h1>

    <section class="game-controls" aria-label="Game controls">
        <h2>Press Space-bar to Start the Game</h2>
        <button id="restart-btn" type="button" hidden>Restart Game</button>
    </section>

    <div class="container">

        <div class="row">

            <div class="btn red" id="red"></div>

            <div class="btn yellow" id="yellow"></div>

        </div>

        <div class="row">

            <div class="btn green" id="green"></div>

            <div class="btn blue" id="blue"></div>

        </div>

    </div>
    <h1>Vedant Patel</h1><!-- enter your name Between h1 tag -->

    <script src="app2.js"></script>

</body>
</html>
